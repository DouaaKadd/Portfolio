<header class="w-full sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-neutral-200">
  <div class="mx-auto max-w-7xl px-6 lg:px-10 pt-4 pb-3 grid grid-cols-3 items-center text-xs tracking-wide uppercase font-mono gap-4">
    <a href="#top" class="flex items-center gap-2 link-underline justify-self-start">
      <span aria-hidden="true">✦</span>
      <span class="hidden sm:inline">{{ 'header.tagline' | translate }}</span>
    </a>

    <div class="flex flex-col items-center justify-self-center">
      <a href="#top" class="font-serif-display text-base sm:text-lg italic">Douaa</a>
      <span class="mt-1 border border-neutral-950 px-2 py-0.5 text-[10px]">{{ handle }}</span>
    </div>

    <nav class="flex items-center gap-4 sm:gap-6 justify-self-end">
      @for (link of links; track link.key) {
        <a [href]="link.href" class="link-underline hidden sm:inline-block" target="_blank" rel="noopener">
          {{ link.key | translate }}
        </a>
      }
      <app-language-switcher />
    </nav>
  </div>
</header>
