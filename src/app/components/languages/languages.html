<section id="languages" class="border-t border-neutral-950">
  <div class="mx-auto max-w-7xl px-6 lg:px-10 py-16 lg:py-24 grid grid-cols-12 gap-8">
    <div class="col-span-12 sm:col-span-4">
      <p class="font-mono text-xs uppercase tracking-[0.3em] text-neutral-500">
        <span aria-hidden="true" class="mark">✦</span> {{ 'languages.label' | translate }}
      </p>
      <p class="font-serif-display text-3xl mt-4 max-w-xs">
        {{ 'languages.subtitle' | translate }}
      </p>
    </div>

    <div class="col-span-12 sm:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-x-12 gap-y-8">
      @for (lang of items; track lang.id) {
        <div>
          <div class="flex items-baseline justify-between mb-3">
            <p class="font-serif-display text-xl flex items-center gap-2">
              <span class="text-2xl" aria-hidden="true">{{ lang.flag }}</span>
              {{ lang.nameKey | translate }}
            </p>
            <span class="font-mono text-[10px] uppercase tracking-widest text-neutral-500">
              {{ (lang.level === 'native' ? 'languages.native' : 'languages.b2') | translate }}
            </span>
          </div>
          <div class="flex gap-1.5">
            @for (b of bars(lang.bars); track $index) {
              <span class="h-1.5 flex-1"
                [class.bg-neutral-950]="b === 1"
                [class.bg-neutral-200]="b === 0"
                aria-hidden="true"></span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
