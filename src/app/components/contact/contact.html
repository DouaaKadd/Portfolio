<section id="contact" class="border-t border-neutral-950 bg-neutral-950 text-white">
  <div class="mx-auto max-w-7xl px-6 lg:px-10 py-16 lg:py-24 grid grid-cols-12 gap-8">
    <div class="col-span-12 sm:col-span-5 flex flex-col">
      <p class="font-mono text-xs uppercase tracking-[0.3em] text-neutral-400">
        <span aria-hidden="true" class="mark">✦</span> {{ 'contact.label' | translate }}
      </p>
      <h2 class="font-serif-display text-4xl sm:text-5xl mt-6 leading-tight">
        {{ 'contact.headline' | translate }}<br />
        <span class="text-neutral-400">{{ 'contact.subheadline' | translate }}</span>
      </h2>

      <a [href]="'mailto:' + email" class="mt-10 inline-block font-serif-display text-2xl link-underline">
        {{ email }}
      </a>

      <p class="font-mono text-[11px] uppercase tracking-widest text-neutral-400 mt-4">
        {{ 'contact.location' | translate }}
      </p>

      <div class="mt-10 flex flex-wrap gap-3">
        <a href="https://www.linkedin.com/in/douaa-kaddar" target="_blank" rel="noopener"
          class="inline-flex items-center gap-2 px-4 py-2 border border-white font-mono text-xs uppercase tracking-widest hover:bg-white hover:text-neutral-950 transition-colors">
          LinkedIn ↗
        </a>
        <a href="https://github.com/DouaaKadd" target="_blank" rel="noopener"
          class="inline-flex items-center gap-2 px-4 py-2 border border-white font-mono text-xs uppercase tracking-widest hover:bg-white hover:text-neutral-950 transition-colors">
          GitHub ↗
        </a>
        <a href="cv-douaa-kaddar.pdf" download
          class="inline-flex items-center gap-2 px-4 py-2 bg-white text-neutral-950 font-mono text-xs uppercase tracking-widest hover:bg-neutral-200 transition-colors">
          ↓ {{ 'contact.downloadCv' | translate }}
        </a>
      </div>
    </div>

    <form (submit)="send(); $event.preventDefault()" class="col-span-12 sm:col-span-7 space-y-6">
      <div>
        <label for="name" class="font-mono text-[11px] uppercase tracking-widest text-neutral-400">{{ 'contact.form.name' | translate }}</label>
        <input id="name" type="text" name="name" [(ngModel)]="form.name" required
          class="w-full bg-transparent border-b border-neutral-700 focus:border-white outline-none py-2 text-lg" />
      </div>
      <div>
        <label for="email" class="font-mono text-[11px] uppercase tracking-widest text-neutral-400">{{ 'contact.form.email' | translate }}</label>
        <input id="email" type="email" name="email" [(ngModel)]="form.email" required
          class="w-full bg-transparent border-b border-neutral-700 focus:border-white outline-none py-2 text-lg" />
      </div>
      <div>
        <label for="message" class="font-mono text-[11px] uppercase tracking-widest text-neutral-400">{{ 'contact.form.message' | translate }}</label>
        <textarea id="message" name="message" rows="5" [(ngModel)]="form.message" required
          class="w-full bg-transparent border-b border-neutral-700 focus:border-white outline-none py-2 text-base resize-none"></textarea>
      </div>

      <button type="submit"
        class="mt-4 px-6 py-3 border border-white font-mono text-xs uppercase tracking-widest hover:bg-white hover:text-neutral-950 transition-colors">
        {{ 'contact.form.send' | translate }}
      </button>

      @if (sent()) {
        <p class="font-mono text-[11px] uppercase tracking-widest text-neutral-400">{{ 'contact.sent' | translate }}</p>
      }
    </form>
  </div>
</section>
